x-prod-service-defaults: &prod-service-defaults
  # Run tini as PID 1 so orphaned child processes are reaped instead of
  # accumulating inside long-lived containers.
  init: true
  # Prevent a process that is compromised inside the container from gaining
  # extra privileges through setuid binaries or similar mechanisms.
  security_opt:
    - no-new-privileges:true
  # Bound fork/process exhaustion if a public service is abused.
  pids_limit: 512

x-prod-locked-down-service: &prod-locked-down-service
  <<: *prod-service-defaults
  # Drop Linux capabilities by default. Services that need a capability should
  # opt back into only that specific capability.
  cap_drop:
    - ALL
  # Keep the container root filesystem immutable so a service compromise cannot
  # persist changes outside of explicitly mounted volumes or tmpfs paths.
  read_only: true
  # Provide scratch space without writing to the image filesystem.
  tmpfs:
    - /tmp

x-prod-nginx-service: &prod-nginx-service
  <<: *prod-locked-down-service
  # The nginx image's nginx user is uid/gid 101. Running as it avoids needing
  # root just to serve static files on an unprivileged internal port.
  user: "101:101"
  # nginx needs writable runtime/cache directories even when the image
  # filesystem is read-only; tmpfs keeps those writes ephemeral.
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    - /var/cache/nginx:rw,noexec,nosuid,size=64m,mode=1777
    - /var/run:rw,noexec,nosuid,size=8m,mode=1777

services:
  traefik:
    <<: *prod-locked-down-service
    command:
      # Use a static file provider instead of the Docker provider so Traefik
      # does not need access to /var/run/docker.sock. This prevents a Traefik
      # compromise from becoming Docker API access to the host.
      - "--providers.file.filename=/etc/traefik/prod-mono.dynamic.yaml"
      - "--providers.file.watch=false"
      # Listen on high ports inside the container so Traefik does not require
      # NET_BIND_SERVICE. The router exposes public 80/443 and forwards to the
      # host's high published ports below.
      - "--entrypoints.web.address=:8080"
      - "--entrypoints.websecure.address=:8443"
      # Public traffic reaches the host through router port forwarding:
      # internet 80 -> host 40080 -> container 8080, and
      # internet 443 -> host 40443 -> container 8443. Redirect directly to the
      # public HTTPS port because Traefik v3 has no separate redirect port flag.
      - "--entrypoints.web.http.redirections.entrypoint.to=:443"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Use TLS-ALPN-01 instead of HTTP-01 because this local hosting setup may
      # have public port 80 blocked while public 443 is still reachable.
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"

    configs:
      - source: traefik_dynamic_prod_mono
        target: /etc/traefik/prod-mono.dynamic.yaml

    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}

    volumes:
      # Persist ACME state across container restarts to avoid certificate
      # re-issuance loops and Let's Encrypt rate limits.
      - traefik_letsencrypt:/letsencrypt

    ports:
      - "40080:8080"
      - "40443:8443"

  postgres_osm:
    <<: *prod-service-defaults

    volumes:
      # Postgres needs a writable data directory; other inputs are read-only so
      # a database compromise cannot rewrite initialization/config files.
      - postgres_osm_data:/var/lib/postgresql/data
      - ./services/postgres_osm/postgres.conf:/etc/postgresql.conf:ro
      - ./services/postgres_osm/init:/docker-entrypoint-initdb.d/:ro

  postgres_gtfs:
    <<: *prod-service-defaults

    volumes:
      # Postgres needs a writable data directory; other inputs are read-only so
      # a database compromise cannot rewrite initialization/config files.
      - postgres_gtfs_data:/var/lib/postgresql/data
      - ./services/postgres_gtfs/postgres.conf:/etc/postgresql.conf:ro
      - ./services/postgres_gtfs/init:/docker-entrypoint-initdb.d/:ro

  omt_tileserver_gl:
    <<: *prod-locked-down-service

  static_tile_server:
    <<: *prod-nginx-service

    volumes:
      # Prod CORS is handled by Traefik, so use a smaller nginx config here and
      # keep CORS policy at the proxy layer.
      - ./services/static_tile_server/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

  static_frontend:
    <<: *prod-nginx-service

  core_service:
    <<: *prod-locked-down-service
    # Run the API as a high non-root uid/gid. The runtime image does not need to
    # own files because the service is stateless.
    user: "65532:65532"

  valhalla:
    <<: *prod-locked-down-service

    # In prod serving mode, bypass the scripted entrypoint because it rewrites
    # files in /custom_files during startup.
    entrypoint:
      - valhalla_service
    command:
      - /custom_files/valhalla.json
      - "${VALHALLA_SERVER_THREADS:-2}"

    volumes:
      # Valhalla graph/config data is generated ahead of deployment and should
      # not be writable by the request-serving container.
      - ${VALHALLA_CUSTOM_FILES_DIR}:/custom_files:ro

configs:
  traefik_dynamic_prod_mono:
    # Compose can mount file-backed configs into read-only services. Inline
    # `content` configs are not supported when the service has read_only: true.
    file: ./services/traefik/prod-mono.dynamic.yaml

volumes:
  traefik_letsencrypt:
