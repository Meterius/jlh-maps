services:
  # Deployment overlays must provide the data volumes/binds omitted here:
  # - omt_tileserver_gl: /data, /style, /build
  # - raster_tile_json_server: /usr/share/nginx/html/raster/sen2
  # - frontend: /usr/share/nginx/html
  # - valhalla: /custom_files
  # compose.local.yaml and compose.prod.mono.yaml use host bind mounts.
  traefik:
    image: traefik:v3.6

  postgres_osm:
    build:
      context: ./postgres_osm
      dockerfile: Dockerfile

    restart: unless-stopped

    command: -c config_file=/etc/postgresql.conf

    volumes:
      - postgres_osm_data:/var/lib/postgresql/data
      - ./postgres_osm/postgres.conf:/etc/postgresql.conf
      - ./postgres_osm/init:/docker-entrypoint-initdb.d/

    environment:
      POSTGRES_USER: ${POSTGRES_OSM_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OSM_PASSWORD}
      POSTGRES_DB: ${POSTGRES_OSM_DB}

  omt_tileserver_gl:
    image: "maptiler/tileserver-gl:latest"

    command:
      - --port
      - "8080"
      - --config
      - "/style/config.json"

  raster_tile_json_server:
    image: nginx:alpine

    restart: unless-stopped

    volumes:
      - ./raster_tile_json_server/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: nginx:alpine

    restart: unless-stopped

    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  core_service:
    build:
      context: ../
      dockerfile: infra/core_service/Dockerfile
    restart: unless-stopped

    environment:
      RUST_LOG: info
      HOST: 0.0.0.0
      PORT: 8080
      POSTGRES_OSM_URL: postgres://${POSTGRES_OSM_USER}:${POSTGRES_OSM_PASSWORD}@postgres_osm:5432/${POSTGRES_OSM_DB}

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest

volumes:
  postgres_osm_data:
