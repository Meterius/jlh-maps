services:
  # Environment files provide the host artifact paths mounted by this base stack:
  # - OPENMAPTILES_DIR
  # - SAT_RASTER_TILE_JSON_DIR
  # - OSM2STREETS_PMTILES_PATH
  # - JLH_MAPS_DIST_DIR
  # - VALHALLA_CUSTOM_FILES_DIR
  traefik:
    image: traefik:v3.6
    networks:
      # Traefik is the only request entrypoint. It joins private backend
      # networks solely to reverse-proxy to each service.
      - traefik_public
      - static_frontend_private
      - api_private
      - tiles_private
      - static_tiles_private
      - valhalla_private

  postgres_osm:
    build:
      context: ./services/postgres_osm
      dockerfile: Dockerfile

    restart: unless-stopped

    command: -c config_file=/etc/postgresql.conf

    volumes:
      - postgres_osm_data:/var/lib/postgresql/data
      - ./services/postgres_osm/postgres.conf:/etc/postgresql.conf
      - ./services/postgres_osm/init:/docker-entrypoint-initdb.d/

    environment:
      POSTGRES_USER: ${POSTGRES_OSM_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OSM_PASSWORD}
      POSTGRES_DB: ${POSTGRES_OSM_DB}

    networks:
      - postgres_private

  postgres_gtfs:
    image: postgis/postgis:17-3.5

    restart: unless-stopped

    command: -c config_file=/etc/postgresql.conf

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    volumes:
      - postgres_gtfs_data:/var/lib/postgresql/data
      - ./services/postgres_gtfs/postgres.conf:/etc/postgresql.conf
      - ./services/postgres_gtfs/init:/docker-entrypoint-initdb.d/

    environment:
      POSTGRES_USER: ${POSTGRES_GTFS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_GTFS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_GTFS_DB}

    networks:
      - postgres_gtfs_private

  omt_tileserver_gl:
    image: "maptiler/tileserver-gl:latest"

    command:
      - --port
      - "8080"
      - --config
      - "/style/config.json"

    volumes:
      - ${OPENMAPTILES_DIR}/data:/data:ro
      - ${OPENMAPTILES_DIR}/style:/style:ro
      - ${OPENMAPTILES_DIR}/build:/build:ro

    networks:
      - tiles_private

  static_tile_server:
    image: nginx:alpine

    restart: unless-stopped

    volumes:
      # Deployment overlays must provide /etc/nginx/conf.d/default.conf.
      - ${SAT_RASTER_TILE_JSON_DIR}:/usr/share/nginx/html/raster/sen2:ro
      - ${OSM2STREETS_PMTILES_PATH:?OSM2STREETS_PMTILES_PATH is required}:/usr/share/nginx/html/roads/tiles.pmtiles:ro

    networks:
      - static_tiles_private

  static_frontend:
    image: nginx:alpine

    restart: unless-stopped

    volumes:
      - ./services/static_frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${JLH_MAPS_DIST_DIR}:/usr/share/nginx/html:ro

    networks:
      - static_frontend_private

  core_service:
    build:
      context: ../
      dockerfile: infra/services/core_service/Dockerfile
    restart: unless-stopped

    environment:
      RUST_LOG: info
      HOST: 0.0.0.0
      PORT: 8080
      POSTGRES_OSM_URL: postgres://${POSTGRES_OSM_USER}:${POSTGRES_OSM_PASSWORD}@postgres_osm:5432/${POSTGRES_OSM_DB}

    networks:
      - api_private
      - postgres_private

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest

    volumes:
      # Local uses the scripted image entrypoint, which can update this directory
      # while preparing graph data. Prod replaces this with a read-only mount.
      - ${VALHALLA_CUSTOM_FILES_DIR}:/custom_files

    networks:
      - valhalla_private

networks:
  traefik_public:
    driver: bridge
  static_frontend_private:
    driver: bridge
    # Internal networks have no direct external routing. Public requests must
    # pass through Traefik rather than reaching backend containers directly.
    internal: true
  api_private:
    driver: bridge
    internal: true
  postgres_private:
    driver: bridge
    internal: true
  postgres_gtfs_private:
    driver: bridge
    internal: true
  tiles_private:
    driver: bridge
    internal: true
  static_tiles_private:
    driver: bridge
    internal: true
  valhalla_private:
    driver: bridge
    internal: true

volumes:
  postgres_osm_data:
  postgres_gtfs_data:
