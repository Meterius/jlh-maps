services:
  # Deployment overlays must provide the data volumes/binds omitted here:
  # - omt_tileserver_gl: /data, /style, /build
  # - static_tile_server: /usr/share/nginx/html/raster/sen2, /usr/share/nginx/html/roads/tiles.pmtiles
  # - frontend: /usr/share/nginx/html
  # - valhalla: /custom_files
  # compose.local.yaml and compose.prod.mono.yaml use host bind mounts.
  traefik:
    image: traefik:v3.6
    networks:
      # Traefik is the only request entrypoint. It joins private backend
      # networks solely to reverse-proxy to each service.
      - traefik_public
      - frontend_private
      - api_private
      - tiles_private
      - static_tiles_private
      - valhalla_private

  postgres_osm:
    build:
      context: ./services/postgres_osm
      dockerfile: Dockerfile

    restart: unless-stopped

    command: -c config_file=/etc/postgresql.conf

    volumes:
      - postgres_osm_data:/var/lib/postgresql/data
      - ./services/postgres_osm/postgres.conf:/etc/postgresql.conf
      - ./services/postgres_osm/init:/docker-entrypoint-initdb.d/

    environment:
      POSTGRES_USER: ${POSTGRES_OSM_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OSM_PASSWORD}
      POSTGRES_DB: ${POSTGRES_OSM_DB}

    networks:
      - postgres_private

  omt_tileserver_gl:
    image: "maptiler/tileserver-gl:latest"

    command:
      - --port
      - "8080"
      - --config
      - "/style/config.json"

    networks:
      - tiles_private

  static_tile_server:
    image: nginx:alpine

    restart: unless-stopped

    volumes:
      - ./services/static_tile_server/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - static_tiles_private

  frontend:
    image: nginx:alpine

    restart: unless-stopped

    volumes:
      - ./services/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - frontend_private

  core_service:
    build:
      context: ../
      dockerfile: infra/services/core_service/Dockerfile
    restart: unless-stopped

    environment:
      RUST_LOG: info
      HOST: 0.0.0.0
      PORT: 8080
      POSTGRES_OSM_URL: postgres://${POSTGRES_OSM_USER}:${POSTGRES_OSM_PASSWORD}@postgres_osm:5432/${POSTGRES_OSM_DB}

    networks:
      - api_private
      - postgres_private

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest

    networks:
      - valhalla_private

networks:
  traefik_public:
    driver: bridge
  frontend_private:
    driver: bridge
    # Internal networks have no direct external routing. Public requests must
    # pass through Traefik rather than reaching backend containers directly.
    internal: true
  api_private:
    driver: bridge
    internal: true
  postgres_private:
    driver: bridge
    internal: true
  tiles_private:
    driver: bridge
    internal: true
  static_tiles_private:
    driver: bridge
    internal: true
  valhalla_private:
    driver: bridge
    internal: true

volumes:
  postgres_osm_data:
