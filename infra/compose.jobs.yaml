services:
  gtfs_ingest_seed_sources:
    build:
      context: ../
      dockerfile: infra/jobs/gtfs_ingest_worker/Dockerfile

    init: true

    environment:
      POSTGRES_GTFS_URL: postgres://${POSTGRES_GTFS_USER}:${POSTGRES_GTFS_PASSWORD}@postgres_gtfs:5432/${POSTGRES_GTFS_DB}
      RUST_LOG: info

    volumes:
      - ./config/gtfs_feed_sources_seed.yaml:/config/feed_sources_seed.yaml:ro

    depends_on:
      postgres_gtfs:
        condition: service_healthy

    networks:
      - postgres_gtfs_private

    command:
      - seed-sources
      - --seed-file
      - /config/feed_sources_seed.yaml

  gtfs_ingest_sync_sources:
    build:
      context: ../
      dockerfile: infra/jobs/gtfs_ingest_worker/Dockerfile

    init: true

    environment:
      POSTGRES_GTFS_URL: postgres://${POSTGRES_GTFS_USER}:${POSTGRES_GTFS_PASSWORD}@postgres_gtfs:5432/${POSTGRES_GTFS_DB}
      GTFS_ARTIFACT_S3_ENDPOINT: http://gtfs_artifact_store:3900
      GTFS_ARTIFACT_S3_REGION: garage
      GTFS_ARTIFACT_S3_BUCKET: ${GTFS_ARTIFACT_S3_BUCKET:?GTFS_ARTIFACT_S3_BUCKET is required}
      GTFS_ARTIFACT_S3_ACCESS_KEY_ID: ${GTFS_ARTIFACT_S3_ACCESS_KEY_ID:?GTFS_ARTIFACT_S3_ACCESS_KEY_ID is required}
      GTFS_ARTIFACT_S3_SECRET_ACCESS_KEY: ${GTFS_ARTIFACT_S3_SECRET_ACCESS_KEY:?GTFS_ARTIFACT_S3_SECRET_ACCESS_KEY is required}
      RUST_LOG: info

    depends_on:
      postgres_gtfs:
        condition: service_healthy
      gtfs_artifact_store:
        condition: service_healthy

    networks:
      - postgres_gtfs_private
      - gtfs_artifact_private
      - traefik_public

    command:
      - sync-sources

  gtfs_ingest_sync_tiling:
    build:
      context: ../
      dockerfile: infra/jobs/gtfs_ingest_worker/Dockerfile

    init: true

    environment:
      POSTGRES_GTFS_URL: postgres://${POSTGRES_GTFS_USER}:${POSTGRES_GTFS_PASSWORD}@postgres_gtfs:5432/${POSTGRES_GTFS_DB}
      RUST_LOG: info

    depends_on:
      postgres_gtfs:
        condition: service_healthy

    networks:
      - postgres_gtfs_private

    command:
      - sync-tiling

  gtfs_ingest_export_tiling:
    build:
      context: ../
      dockerfile: infra/jobs/gtfs_ingest_worker/Dockerfile

    init: true

    environment:
      POSTGRES_GTFS_URL: postgres://${POSTGRES_GTFS_USER}:${POSTGRES_GTFS_PASSWORD}@postgres_gtfs:5432/${POSTGRES_GTFS_DB}
      RUST_LOG: info

    volumes:
      - ${GTFS_PMTILES_DIR:?GTFS_PMTILES_DIR is required}:/pmtiles

    depends_on:
      postgres_gtfs:
        condition: service_healthy

    networks:
      - postgres_gtfs_private

    command:
      - export-tiling
      - --output-file
      - /pmtiles/tiles.pmtiles

  postgres_osm_importer:
    image: iboates/osm2pgsql:latest
    environment:
      PGPASSWORD: ${POSTGRES_OSM_PASSWORD}

    volumes:
      - ./jobs/postgres_osm_importer/style.lua:/data/style.lua:ro

    depends_on:
      - postgres_osm

    networks:
      - postgres_private
      - traefik_public

    command:
      - -d
      - ${POSTGRES_OSM_DB}
      - -U
      - ${POSTGRES_OSM_USER}
      - -H postgres_osm
      - -P 5432
      - -O flex
      - -S /data/style.lua
      - https://download.geofabrik.de/europe/germany-latest.osm.pbf
