services:
  gtfs_ingest_seed_sources:
    build:
      context: ../
      dockerfile: infra/jobs/gtfs_ingest_worker/Dockerfile

    init: true

    environment:
      POSTGRES_GTFS_URL: postgres://${POSTGRES_GTFS_USER}:${POSTGRES_GTFS_PASSWORD}@postgres_gtfs:5432/${POSTGRES_GTFS_DB}
      RUST_LOG: info

    volumes:
      - ./config/gtfs_feed_sources_seed.yaml:/config/feed_sources_seed.yaml:ro

    depends_on:
      postgres_gtfs:
        condition: service_healthy

    networks:
      - postgres_gtfs_private

    command:
      - seed-sources
      - --seed-file
      - /config/feed_sources_seed.yaml

  postgres_osm_importer:
    image: iboates/osm2pgsql:latest
    environment:
      PGPASSWORD: ${POSTGRES_OSM_PASSWORD}

    volumes:
      - ./jobs/postgres_osm_importer/style.lua:/data/style.lua:ro

    depends_on:
      - postgres_osm

    networks:
      - postgres_private
      - traefik_public

    command:
      - -d
      - ${POSTGRES_OSM_DB}
      - -U
      - ${POSTGRES_OSM_USER}
      - -H postgres_osm
      - -P 5432
      - -O flex
      - -S /data/style.lua
      - https://download.geofabrik.de/europe/germany-latest.osm.pbf
