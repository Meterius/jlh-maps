[package]
name = "jlh_maps_app"
version = "0.1.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
profile = ["bevy/trace_chrome"]
wasm-threads = [
    "dep:rayon",
    "dep:wasm-bindgen-rayon",
    "bevy_ecs/wasm_threads",
    "bevy_tasks/wasm_threads",
]

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "std",
    "async_executor",
    "reflect_auto_register",
    "bevy_asset",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_camera",
    "bevy_light",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "keyboard",
    "mouse",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "web",
    "webgpu",
] }
bevy_ecs = { version = "0.18.1", default-features = false }
bevy_tasks = { version = "0.18.1", default-features = false }
big_space = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsify = { version = "0.5", features = ["js"] }
smallvec = "1.15.1"
wasm-bindgen = "0.2.118"
web-sys = { version = "0.3.95", features = ["OffscreenCanvas", "WebGlFramebuffer"] }
console_error_panic_hook = "0.1.7"
egui = "0.33.3"
egui_dock = { git = "https://github.com/Avarel/egui_dock", branch = "egui_0.33" }
bevy-inspector-egui = { version = "0.36.0", default-features = false, features = ["bevy", "documentation"] }
tracing = "0.1.44"
geojson = "0.24.2"
geo-types = { version = "=0.7.19", default-features = false, features = ["rstar_0_12"] }
mvt-reader = "2.3.0"
earcutr = "0.4.3"
map_scatter = "0.4.1"
rand = "0.9"
anyhow = "1.0.102"
raw-window-handle = "0.6.2"
rayon = { version = "1.11.0", optional = true }
rstar = "=0.12.2"
geo = { version = "=0.33.1", default-features = false }
itertools = "0.14.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
geozero = { version = "0.15.1", default-features = false, features = ["with-geojson", "with-mvt"] }
pmtiles = { version = "0.23.0", default-features = false, features = ["mmap-async-tokio", "write"] }
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3.0", optional = true }
wasm-bindgen-futures = "0.4"
