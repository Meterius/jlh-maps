[package]
name = "gtfs_ingest_worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gtfs_ingest"
path = "src/bin/gtfs_ingest.rs"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.42"
clap = { version = "4.6.1", features = ["derive", "env"] }
gtfs-structures = { version = "0.48.0", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
rgb = "0.8.52"
rust-s3 = { version = "0.37.2", default-features = false, features = ["tokio-rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
